  - changeSet:
      id: 13-back-orders-link-client-and-delivery-note-not-supplier
      author: dev
      # Deja cree par 0-base-schema (schema.sql) sur une base neuve : marquer comme joue.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: back_orders
                columnName: id_client
      comments: >
        A back order tracks a shortfall on a delivery to a CLIENT (via the
        delivery note/sales order that couldn't be fully fulfilled), not a
        shortfall from a supplier purchase order. Replaces the supplier/PO
        fields with client + delivery note fields.
      changes:
        - dropIndex:
            tableName: back_orders
            indexName: idx_back_orders_bon_achat
        - dropColumn:
            tableName: back_orders
            columns:
              - column:
                  name: id_bon_achat
              - column:
                  name: numero_bon_achat
              - column:
                  name: id_fournisseur
              - column:
                  name: nom_fournisseur
        - addColumn:
            tableName: back_orders
            columns:
              - column:
                  name: id_client
                  type: uuid
              - column:
                  name: nom_client
                  type: varchar(255)
              - column:
                  name: adresse_client
                  type: varchar(500)
              - column:
                  name: email_client
                  type: varchar(255)
              - column:
                  name: telephone_client
                  type: varchar(50)
              - column:
                  name: id_bon_livraison
                  type: uuid
              - column:
                  name: numero_bon_livraison
                  type: varchar(100)
        - createIndex:
            tableName: back_orders
            indexName: idx_back_orders_client
            columns:
