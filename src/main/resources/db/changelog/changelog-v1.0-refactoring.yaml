  - changeSet:
      id: 21-add-refresh-token-to-seller-auth-contexts
      author: dev
      # Deja cree par 0-base-schema (schema.sql) sur une base neuve : marquer comme joue.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: seller_auth_contexts
                columnName: refresh_token
      comments: >
        PIN login never talks to Kernel on its own, so it had no access token
        to hand the frontend. Caches the seller's refresh token from their last
        real Kernel login so PIN login can mint a fresh one via /api/auth/refresh.
      changes:
        - addColumn:
            tableName: seller_auth_contexts
            columns:
              - column:
                  name: refresh_token
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: refresh_expires_at
                  type: timestamp
                  constraints:
                    nullable: true

  # changelog-v1.1 and v1.2 were never wired into spring.liquibase.change-log,
  # so their addColumn changesets (agency_id on factures/devis/paiements/
  # notes_credit/taxes/journals/factures_proforma, origin_type+session_id on
  # factures) have never run anywhere, including locally — those columns only
  # exist locally because they were added out-of-band. Including them here
  # makes this the one changelog Spring Boot actually loads.
  - include:
      file: changelog-v1.1-agency-id.yaml
      relativeToChangelogFile: true
  - include:
      file: changelog-v1.2-facture-origin.yaml
      relativeToChangelogFile: true

  - changeSet:
      id: 32-live-notifications-pending-invoices
      author: dev
      comments: >
        pending_facture_ids (bare uuid[]) required re-fetching each invoice
        from Kernel at flush time — a @Scheduled background tick with no
        caller token available, so that fetch always failed silently and the
        queue was cleared without ever sending anything. Replaced with a
        jsonb snapshot of the display fields, captured at enqueue time when a
        real caller token exists.
      changes:
        - addColumn:
            tableName: live_notifications
            columns:
              - column:
                  name: pending_invoices
                  type: jsonb
                  defaultValue: "[]"
                  constraints:
                    nullable: false
        - sql:
            sql: >
              UPDATE live_notifications SET pending_invoices = '[]'::jsonb WHERE pending_invoices IS NULL;
        - dropColumn:
            tableName: live_notifications
            columnName: pending_facture_ids

  - changeSet:
      id: 33-live-notifications-channel
      author: dev
      comments: >
        Lets a rule batch-and-send over TELEGRAM (needs the contact linked to
        the bot first) or EMAIL (no linking needed, straight to their inbox).
      changes:
        - addColumn:
            tableName: live_notifications
            columns:
              - column:
                  name: channel
                  type: varchar(20)
                  defaultValue: TELEGRAM
                  constraints:
                    nullable: false

  - changeSet:
      id: 34-create-product-sale-size-configs
      author: dev
      comments: >
        Per-product sale config (image, per-size pricing/negotiability, VAT
        applicability) for a Kernel product-core product. product-core's own
        "variants" concept is a generic sku/name thing with no price, image,
        or VAT field anywhere in the new product schemas, so this stays
        Billing's own local config, joined onto the Kernel-fetched product by
        productId at read time.
      changes:
        - createTable:
            tableName: product_sale_size_configs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: photo
