databaseChangeLog:
  - changeSet:
      id: 0-base-schema
      author: yowyob-deploy
      # Base deja creee (poste de dev, base existante) : schema.sql n'est pas rejouable
      # (CREATE INDEX sans IF NOT EXISTS) -> marquer comme joue.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_organizations
      comments: >
        Schema de base (schema.sql). Les changesets suivants supposent ces tables :
        sans lui, une base vide (la production) echoue des le changeset 1.
        Idempotent : CREATE TABLE IF NOT EXISTS.
      changes:
        - sqlFile:
            path: schema.sql
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 1-create-user-organization-permissions
      author: refactoring-agent
      # Deja cree par 0-base-schema (schema.sql) sur une base neuve : marquer comme joue.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_organization_permissions
      comments: Create user_organization_permissions table
      changes:
        - createTable:
            tableName: user_organization_permissions
            remarks: Junction table for fine-grained permissions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_organization_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_org_perm_user_org
                    references: user_organizations(id)
                    deleteCascade: true
              - column:
                  name: permission
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: granted_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: granted_by
                  type: uuid
                  remarks: User who granted this permission
              - column:
                  name: expires_at
                  type: timestamp
                  remarks: Optional expiration date for temporary permissions

        - addUniqueConstraint:
            tableName: user_organization_permissions
            columnNames: user_organization_id, permission
            constraintName: uk_user_org_permission

        - createIndex:
            tableName: user_organization_permissions
            indexName: idx_user_org_perm_user_org
            columns:
              - column:
                  name: user_organization_id

        - createIndex:
            tableName: user_organization_permissions
            indexName: idx_user_org_perm_permission
            columns:
              - column:
                  name: permission
  - changeSet:
      id: 2-drop-legacy-tiers-tables
      author: refactoring-agent
      comments: Drop legacy clients and fournisseurs tables if they exist
      changes:
        - sql:
            sql: "DROP TABLE IF EXISTS clients; DROP TABLE IF EXISTS fournisseurs;"

